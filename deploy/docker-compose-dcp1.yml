# Qualified fallback: TP4/DCP1, CUDA graphs, dynamic BF16 rank-16 LoRA, MTP disabled.
services:
  glm52:
    image: ${IMAGE:-ghcr.io/jcartu/glm52-exl3-lora@sha256:3014c71c1d216b8c9fb53326f3c6ffaa993a8145567c4a3513dc6c645ec60e5b}
    container_name: glm52-exl3-lora-v31-dcp1
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    gpus: all
    shm_size: "32g"
    ipc: host
    ulimits:
      memlock: -1
      nofile: 1048576
    environment:
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-3,1,2,0}"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_DEVICE_MAX_CONNECTIONS: "32"
      CUTE_DSL_ARCH: sm_120a
      TORCH_CUDA_ARCH_LIST: 12.0a
      FLASHINFER_CUDA_ARCH_LIST: 12.0f
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "16"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      SAFETENSORS_FAST_GPU: "1"
      NCCL_IB_DISABLE: "1"
      NCCL_P2P_LEVEL: SYS
      NCCL_PROTO: LL,LL128,Simple
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_B12X_FP8_GEMM: "1"
      VLLM_USE_B12X_SPARSE_INDEXER: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_ENABLE_PCIE_ALLREDUCE: "1"
      VLLM_PCIE_ALLREDUCE_BACKEND: b12x
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: "${VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE:-64KB}"
      VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE: "${VLLM_PCIE_ONESHOT_FUSED_ADD_RMS_NORM_MAX_SIZE:-84KB}"
      VLLM_PCIE_DMA_FP8: "0"
      B12X_PCIE_DMA_FP8: "0"
      VLLM_CPP_AR_1STAGE_NCCL_CUTOFF: 56KB
      VLLM_CPP_AR_IGNORE_CUTOFF_MAX_ROWS: "0"
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_FUSED_MOE_GROUPED_TOPK: "1"
      VLLM_USE_B12X_MHC: "1"
      B12X_MHC_MAX_TOKENS: "16384"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      B12X_MLA_SM120_UNIFIED: "1"
      B12X_DENSE_SPLITK_TURBO: "1"
      B12X_W4A16_TC_DECODE: "1"
      B12X_MOE_FORCE_A16: "1"
      VLLM_DISABLE_SHARED_EXPERTS_STREAM: "1"
      VLLM_DISABLED_KERNELS: MarlinFP8ScaledMMLinearKernel
      VLLM_B12X_ABSORB_BMM: "0"
      VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "0"
      VLLM_EXL3_TRELLIS_MIN_M: "1"
      VLLM_EXL3_TRELLIS_MAX_M: "32"
      VLLM_EXL3_TRELLIS_BLOCK_M: "8"
      VLLM_EXL3_PREFILL_TRELLIS: "1"
      VLLM_EXL3_PREFILL_BLOCK_M: "64"
      VLLM_EXL3_PREFILL_CHUNK: "1"
      VLLM_CACHE_DIR: /cache/jit-lora-v31-dcp1/vllm
      TRITON_CACHE_DIR: /cache/jit-lora-v31-dcp1/triton
      TORCH_EXTENSIONS_DIR: /cache/jit-lora-v31-dcp1/torch_extensions
      TORCHINDUCTOR_CACHE_DIR: /cache/jit-lora-v31-dcp1/torchinductor
      FLASHINFER_WORKSPACE_BASE: /cache/jit-lora-v31-dcp1/flashinfer
      XDG_CACHE_HOME: /cache/jit-lora-v31-dcp1
      TVM_FFI_CACHE_DIR: /cache/jit-lora-v31-dcp1/tvm-ffi
      CUTE_DSL_CACHE_DIR: /cache/jit-lora-v31-dcp1/cute-dsl
      B12X_CUTE_COMPILE_CACHE_DIR: /cache/jit-lora-v31-dcp1/b12x-cute
      SPARKINFER_COMPILE_CACHE_DIR: /cache/jit-lora-v31-dcp1/sparkinfer/compile
      VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.90}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-32768}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS:-2}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-3072}"
      ENABLE_MTP: "${ENABLE_MTP:-0}"
      MTP_TOKENS: "${MTP_TOKENS:-3}"
      MTP_DRAFT_SAMPLE_METHOD: "${MTP_DRAFT_SAMPLE_METHOD:-greedy}"
      GLM52_INDEX_TOPK_PATTERN: "${GLM52_INDEX_TOPK_PATTERN:-FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS}"
    volumes:
      - ${MODEL_DIR:-./model}:/model:ro
      - ${ADAPTER_DIR:-./adapter}:/adapter:ro
      - ${CACHE_DIR:-./cache}:/cache:rw
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        set -Eeuo pipefail
        unset NCCL_GRAPH_FILE NCCL_GRAPH_DUMP_FILE VLLM_B12X_MLA_EXTEND_MAX_CHUNKS
        spec_args=()
        if [[ "$${ENABLE_MTP:-0}" == "1" ]]; then
          printf -v spec_config '{"method":"mtp","num_speculative_tokens":%s,"moe_backend":"triton","draft_sample_method":"%s"}' \
            "$${MTP_TOKENS:-3}" "$${MTP_DRAFT_SAMPLE_METHOD:-greedy}"
          spec_args=(--speculative-config "$$spec_config")
        fi
        index_pattern="$${GLM52_INDEX_TOPK_PATTERN}"
        if [[ "$${#index_pattern}" -ne 78 ]]; then
          printf 'GLM-5.2 index_topk_pattern must cover all 78 layers (got %s)\n' "$${#index_pattern}" >&2
          exit 2
        fi
        printf -v hf_overrides '{"use_index_cache":true,"index_topk_pattern":"%s"}' "$$index_pattern"
        exec vllm serve /model \
          --served-model-name GLM-5.2-EXL3-TR3-3.0bpw \
          --host 0.0.0.0 --port 8000 --trust-remote-code \
          --tensor-parallel-size 4 \
          --decode-context-parallel-size 1 \
          --dcp-comm-backend a2a \
          --dcp-kv-cache-interleave-size 64 \
          --seed 0 \
          --quantization exl3 \
          --kv-cache-dtype nvfp4_ds_mla \
          --attention-backend B12X_MLA_SPARSE \
          --moe-backend b12x \
          --load-format safetensors \
          --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8],"custom_ops":["all"],"pass_config":{"fuse_allreduce_rms":true}}' \
          --gpu-memory-utilization "$${GPU_MEMORY_UTILIZATION:-0.90}" \
          --max-model-len "$${MAX_MODEL_LEN:-32768}" \
          --max-num-seqs "$${MAX_NUM_SEQS:-2}" \
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS:-3072}" \
          --max-cudagraph-capture-size 8 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --enable-lora \
          --fully-sharded-loras \
          --lora-dtype bfloat16 \
          --max-lora-rank 16 \
          --max-loras 1 \
          --max-cpu-loras 1 \
          --no-async-scheduling \
          --enable-auto-tool-choice \
          --tool-call-parser glm47 \
          --reasoning-parser glm45 \
          --default-chat-template-kwargs '{"reasoning_effort":"high"}' \
          --hf-overrides "$$hf_overrides" \
          "$${spec_args[@]}"
