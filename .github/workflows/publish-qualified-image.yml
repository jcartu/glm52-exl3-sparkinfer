name: Publish qualified OCI image

on:
  push:
    branches:
      - exl3-lora-base

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'ci(release): publish qualified OCI image' }}"
    runs-on: exl3-lora-publisher
    timeout-minutes: 60
    env:
      DOCKER_CONFIG: /tmp/exl3-actions-docker-auth
      IMAGE: ghcr.io/jcartu/glm52-exl3-lora:v31-95d7914-fc8051e
    steps:
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push qualified image
        run: docker push "$IMAGE"

      - name: Resolve published digest
        run: docker buildx imagetools inspect "$IMAGE"

      - name: Remove registry credentials
        if: always()
        run: |
          docker logout ghcr.io || true
          rm -rf "$DOCKER_CONFIG"
